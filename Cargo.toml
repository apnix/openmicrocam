[workspace]
resolver = "2"
members = ["crates/mi-sys", "crates/mi", "crates/microcam-core", "crates/microcam-draw", "crates/microcamd", "crates/microcam-cli", "crates/microcam-menu"]

[workspace.package]
version = "0.92.0"
edition = "2021"
license = "MIT-0"
repository = "https://github.com/apnix/openmicrocam"

[workspace.dependencies]
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# libjpeg-turbo decodes the picture windows; it is built for speed, not size
[profile.release.package.mozjpeg-sys]
opt-level = 3

# the ui is drawn pixel by pixel on the camera's CPU
[profile.release.package.microcam-draw]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release-sym]
inherits = "release"
strip = false
debug = 1
